<!doctype html>
<html lang="en">
  <head>
    <!-- ==========================================================
                  Event Details
       ========================================================== -->
    <meta charset="UTF-8" />
    <!-- viewport tag = required for responsive design on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Event Details - Smart Campus Event Planner</title>

    <!-- Shared font + stylesheet + logo and javascript defer -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../public/css/style.css" />
    <link rel="icon" href="../public/images/favicon.svg" type="image/svg+xml" />
    <script src="../public/js/main.js" defer></script>
    <script src="../public/js/formValidation.js" defer></script>
  </head>

  <body>
    <nav class="navbar">
      <div class="navbar-inner">
        <a class="navbar-brand" href="index.html">
          <img
            src="../public/images/logo.svg"
            alt=""
            width="28"
            height="28"
            style="vertical-align: middle; margin-right: 6px"
          />
          Campus Events
        </a>

        <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>

        <ul class="navbar-links" id="navbar-links"></ul>
      </div>
    </nav>

    <!-- ================= CONTENT ====================== -->
    <main>
      <!-- Back button: returns to the previous page -->
      <button class="btn btn-secondary back-btn" onclick="history.back()">
        <span style="font-size: 1.5em; line-height: 1">←</span> Back
      </button>

      <!-- Page heading: eyebrow label -->
      <span class="eyebrow">Event Details</span>

      <!-- Everything in this card is empty in the HTML. main.js reads the event
     id from the URL (?id=), finds that event, and fills in each element by
     its id (eventTitle, eventStatus, eventCategory, etc.) -->

      <div class="card">
        <div class="flex-between">
          <h1 id="eventTitle"></h1>
          <!-- filled by main.js -->
          <span id="eventStatus" class="badge badge-open"></span>
          <!-- badge colour set by main.js from status -->
        </div>
        <div class="flex-between">
          <!-- category-->
          <p id="eventCategory" class="badge badge-open"></p>
          <!--organizer-->
          <p>
            organized by <strong><span id="eventOrganizer"></span></strong>
          </p>
        </div>

        <!-- date, start and end time-->
        <p id="eventDateTime" class="muted"></p>

        <!--location-->
        <p id="eventLocation" class="muted"></p>

        <!-- event description-->
        <p id="eventDescription"></p>

        <!-- Action buttons depend on who is viewing. All three blocks start "hidden";
     main.js un-hides the right one based on the logged-in role -->

        <div class="flex-between">
          <!--capacity-->
          <p id="eventCapacity" class="muted"></p>

          <!-- Guest: not logged in - just a prompt to log in, no register button -->
          <div id="guestControls" hidden>
            <p class="muted">Please log in to register for this event.</p>
          </div>

          <!-- Student: can Register, or Cancel Registration if already registered -->
          <div id="studentControls" hidden>
            <button id="registerBtn" class="btn">Register</button>
            <button id="cancelRegistrationBtn" class="btn btn-secondary">
              Cancel Registration
            </button>
          </div>

          <!-- Admin: can Edit the event or Take Attendance (links set by main.js) -->
          <div id="adminControls" hidden>
            <a id="editEventBtn" class="btn" href="#">Edit Event</a>

            <a id="takeAttendanceBtn" class="btn" href="#">Take Attendance</a>
          </div>
        </div>
      </div>
    </main>

    <!-- ================= FOOTER (same on every page) ============ -->
    <footer class="footer">
      Smart Campus Event Planner · SOEN 287 Summer 2026 · Team 13
    </footer>
  </body>
</html>
