<!doctype html>
<html lang="en">
  <head>
    <!-- ==========================================================
                  Admin Profile
       ========================================================== -->
    <meta charset="UTF-8" />
    <!-- viewport tag = required for responsive design on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Profile - Smart Campus Event Planner</title>

    <!-- Shared font + stylesheet + logo and javascript defer -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../public/css/style.css" />
    <link rel="icon" href="../public/images/favicon.svg" type="image/svg+xml" />
    <script src="/public/js/main.js" defer></script>
    <script src="/public/js/formValidation.js" defer></script>
  </head>

  <body>
    <!-- ================= NAVBAR (same on every page) ============ -->
    <nav class="navbar">
      <div class="navbar-inner">
        <a class="navbar-brand" href="/">
          <img
            src="/public/images/logo.svg"
            alt=""
            width="28"
            height="28"
            style="vertical-align: middle"
          />
          Campus Events
        </a>

        <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>

        <ul class="navbar-links" id="navbar-links"></ul>
      </div>
    </nav>

    <!-- ================= CONTENT ====================== -->
    <main>
      <!-- Back button: returns to the previous page (admin dashboard) -->
      <button class="btn btn-secondary back-btn" onclick="history.back()">
        <span style="font-size: 1.5em; line-height: 1">←</span> Back
      </button>

      <!-- Page heading: eyebrow label, page title, and short description -->
      <span class="eyebrow">My Account</span>
      <h1>Admin Profile</h1>
      <p>View and update your personal information.</p>

      <!-- Read-only card showing the admin's current details.
     Hard-coded for Deliverable 1; loaded from the account in D2 -->
      <div class="card">
        <h2>Your Details</h2>
        <p><strong>Full Name:</strong> Admin User</p>
        <p><strong>Email:</strong> admin@campus.ca</p>
        <p><strong>Role:</strong> Organizer / Admin</p>
      </div>

      <!-- Edit form. Its id "profile-form" is how formValidation.js finds it
     to check the inputs before submitting -->
      <div class="card">
        <h2>Edit Profile</h2>
        <form id="profile-form">
          <!-- Full name and email are required (checked by the "required" attribute) -->
          <label for="fullname">Full Name</label>
          <input
            type="text"
            id="fullname"
            name="fullname"
            value="Admin User"
            required
          />

          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            value="admin@campus.ca"
            required
          />

          <!-- Password change section. Current + new + confirm.
     "minlength" gives a basic length check in the browser -->
          <label for="current-password">Current Password</label>
          <input
            type="password"
            id="current-password"
            name="current-password"
            placeholder="Enter current password"
            required
            minlength="6"
          />

          <!-- New password is optional - leaving it blank keeps the current one.
     formValidation.js only checks it if something is typed here -->
          <label for="new-password">New Password</label>
          <input
            type="password"
            id="new-password"
            name="new-password"
            placeholder="Leave blank to keep current"
            minlength="6"
          />

          <label for="confirm-password">Confirm New Password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Confirm new password"
          />

          <!-- Hidden message line. formValidation.js fills it with a green success
     or red error message when the form is submitted -->
          <p id="profile-msg" hidden></p>

          <!-- Submit runs the validation in formValidation.js (not a real save yet;
     the backend saves it in Deliverable 2) -->
          <button class="btn" type="submit">Update Profile</button>
        </form>
      </div>
    </main>

    <!-- ================= FOOTER  ============ -->
    <footer class="footer">
      Smart Campus Event Planner · SOEN 287 Summer 2026 · Team 13
    </footer>
  </body>
</html>
