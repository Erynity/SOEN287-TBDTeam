<!doctype html>
<html lang="en">
  <head>
    <!-- ==========================================================
                  Create Event
       ========================================================== -->
    <meta charset="UTF-8" />
    <!-- viewport tag = required for responsive design on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Event - Smart Campus Event Planner</title>

    <!-- Shared font + stylesheet + logo and javascript defer -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../public/css/style.css" />
    <link rel="icon" href="../public/images/favicon.svg" type="image/svg+xml" />
    <script src="../public/js/main.js" defer></script>
    <script src="../public/js/formValidation.js" defer></script>
  </head>

  <body>
    <!-- ================= NAVBAR (same on every page) ============ -->
    <nav class="navbar">
      <div class="navbar-inner">
        <a class="navbar-brand" href="index.html">
          <img
            src="../public/images/logo.svg"
            alt=""
            width="28"
            height="28"
            style="vertical-align: middle; margin-right: 6px"
          />
          Campus Events
        </a>

        <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>

        <ul class="navbar-links" id="navbar-links"></ul>
      </div>
    </nav>

    <!-- ================= YOUR PAGE CONTENT ====================== -->
    <main>
      <!-- Back button: returns to the previous page (admin dashboard) -->

      <button class="btn btn-secondary back-btn" onclick="history.back()">
        <span style="font-size: 1.5em; line-height: 1">←</span> Back
      </button>

      <!-- Page heading: eyebrow label, page title, and short description -->

      <span class="eyebrow">Event management</span>
      <h1>Creating event</h1>
      <p class="muted">Fill in the details to create a new event.</p>

      <!-- Create Event form. id "create-event-form" is how formValidation.js
     finds it to validate before submitting. Most checks are done by the
     HTML attributes below (required, min); JS checks end time > start time -->

      <form id="create-event-form" action="/events/create" method="post">
        <!-- Title is required (the "required" attribute blocks an empty submit) -->
        <label for="event-name">Event Title:</label>
        <input
          type="text"
          id="event-name"
          name="title"
          placeholder="Give your event a title"
          required
        />

        <!-- Category dropdown. The empty first option has value="" so "required"
     forces the admin to actually pick one -->

        <label for="event-category">Event Category:</label>
        <select id="event-category" name="category" required>
          <option value="">Select the event category</option>
          <option value="academic-workshop">Academic workshops</option>
          <option value="career-events">Career events</option>
          <option value="club-activities">Club activities</option>
          <option value="sports-events">Sports events</option>
          <option value="cultural-events">Cultural events</option>
          <option value="volunteering-events">Volunteering events</option>
          <option value="social-events">Social events</option>
          <option value="guest-lectures">Guest lectures</option>
          <option value="networking-events">Networking events</option>
          <option value="other">Other</option>
        </select>

        <label for="other-category">If "Other", please specify:</label>
        <input
          type="text"
          id="other-category"
          name="other-category"
          placeholder="e.g., Hackathon, Seminar, etc."
        />

        <!-- Date, start time and end time. All required.
     formValidation.js also checks that end time is after start time -->

        <label for="event-date">Event Date:</label>
        <input type="date" id="event-date" name="event_date" required />

        <label for="start-time">Start Time:</label>
        <input type="time" id="start-time" name="start_time" required />

        <label for="end-time">End Time:</label>
        <input type="time" id="end-time" name="end_time" required />

        <label for="event-location">Event Location:</label>
        <input type="text" id="event-location" name="location" required />

        <!-- Capacity must be a number of at least 1 (min="1") -->
        <label for="capacity">Maximum number of participants:</label>
        <input
          type="number"
          id="capacity"
          name="capacity"
          min="1"
          placeholder="e.g., 50"
          min="1"
          required
        />

        <!-- Image upload input (optional) -->

        <label for="imageUpload">Add an image for your event:</label>
        <input type="file" id="imageUpload" name="image" accept="image/*" />

        <!-- Description textarea (required) -->

        <label for="event-description">Event Description:</label>
        <textarea
          id="event-description"
          name="description"
          rows="4"
          placeholder="Enter a brief description of the event to help participants understand what to expect."
          required
        ></textarea>

        <!-- Hidden message line - formValidation.js fills it with a success
     or error message on submit -->

        <p id="event-msg" hidden></p>

        <!-- Submit runs the validation; no real save yet (backend in D2) -->

        <button class="btn" type="submit">Create Event</button>
      </form>
    </main>

    <!-- ================= FOOTER (same on every page) ============ -->
    <footer class="footer">
      Smart Campus Event Planner · SOEN 287 Summer 2026 · Team 13
    </footer>
  </body>
</html>
