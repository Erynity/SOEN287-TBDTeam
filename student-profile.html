<!doctype html>
<html lang="en">
  <head>
    <!-- ==========================================================
                  Student Profile
       ========================================================== -->
    <meta charset="UTF-8" />
    <!-- viewport tag = required for responsive design on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student profile - Smart Campus Event Planner</title>

    <!-- Shared font + stylesheet + logo and javascript defer -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../public/css/style.css" />
    <link rel="icon" href="../public/images/favicon.svg" type="image/svg+xml" />
    <script src="/public/js/main.js" defer></script>
    <script src="/public/js/formValidation.js" defer></script>
  </head>

  <body>
    <!-- ================= NAVBAR (same on every page) ============ -->
    <nav class="navbar">
      <div class="navbar-inner">
        <a class="navbar-brand" href="/">
          <img
            src="/public/images/logo.svg"
            alt=""
            width="28"
            height="28"
            style="vertical-align: middle"
          />
          Campus Events
        </a>

        <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>

        <ul class="navbar-links" id="navbar-links"></ul>
      </div>
    </nav>

    <!-- ================= YOUR PAGE CONTENT ====================== -->
    <main>
      <!-- Back button: returns to the previous page (admin dashboard) -->
      <button class="btn btn-secondary back-btn" onclick="history.back()">
        <span style="font-size: 1.5em; line-height: 1">←</span> Back
      </button>
      <!-- Page heading: eyebrow label, page title, and short description -->
      <span class="eyebrow">My Account</span>
      <h1>Student Profile</h1>
      <p>View and update your personal information.</p>

      <!-- Read-only card showing the student's current details. -->
      <div class="card">
        <h2>Your Details</h2>
        <p><strong>Full Name:</strong> <span id="profileName"></span></p>
        <p><strong>Email:</strong> <span id="profileEmail"></span></p>
        <p><strong>Role:</strong> <span id="profileRole"></span></p>
      </div>
      <!-- Editable card for updating profile information -->
      <div class="card">
        <h2>Edit Profile</h2>
        <form id="profile-form">
          <label for="firstname">First Name</label>
          <input type="text" id="firstname" name="firstname" required />

          <label for="lastname">Last Name</label>
          <input type="text" id="lastname" name="lastname" required />

          <!-- Email input -->
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
          <!-- Current password input -->
          <label for="current-password">Current Password</label>
          <input
            type="password"
            id="current-password"
            name="current-password"
            placeholder="Enter current password"
          />
          <!-- New password input -->
          <label for="new-password">New Password</label>
          <input
            type="password"
            id="new-password"
            name="new-password"
            placeholder="Leave blank to keep current"
            minlength="8"
            required
          />

          <!-- Confirm new password input -->
          <label for="confirm-password">Confirm New Password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Confirm new password"
          />
          <!-- Hidden error message -->
          <p id="profile-msg" hidden></p>

          <!-- Submit button -->
          <button class="btn" type="submit">Update Profile</button>
        </form>
      </div>
    </main>

    <!-- ================= FOOTER  ============ -->
    <footer class="footer">
      Smart Campus Event Planner · SOEN 287 Summer 2026 · Team 13
    </footer>
  </body>
</html>
