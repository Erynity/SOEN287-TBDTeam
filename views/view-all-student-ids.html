<!doctype html>
<html lang="en">
  <head>
     <!-- ==========================================================
                  View All Student IDs
       ========================================================== -->
    <meta charset="UTF-8" />
    <!-- viewport tag = required for responsive design on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student IDs - Smart Campus Event Planner</title>

    <!-- Shared font + stylesheet + logo and javascript defer -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../public/css/style.css" />
    <link rel="icon" href="../public/images/favicon.svg" type="image/svg+xml" />
    <script src="../public/js/main.js" defer></script>
    <script src="../public/js/formValidation.js" defer></script>
  </head>

  <body>
    <!-- ================= NAVBAR (same on every page) ============
       During Deliverable 1 we show ALL links so the prof can
       navigate everything. In Deliverable 2, the backend will
       decide which links to show based on who is logged in.  -->
    <nav class="navbar">
      <div class="navbar-inner">
        <a class="navbar-brand" href="index.html">
          <img
            src="../public/images/logo.svg"
            alt=""
            width="28"
            height="28"
            style="vertical-align: middle; margin-right: 6px"
          />
          Campus Events
        </a>

        <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>

        <ul class="navbar-links" id="navbar-links"></ul>
      </div>
    </nav>

    <!-- ================= YOUR PAGE CONTENT ====================== -->
    <main>
       <!-- Back button: returns to the previous page (admin dashboard) -->
      <button class="btn btn-secondary back-btn" onclick="history.back()">
        <span style="font-size: 1.5em; line-height: 1">←</span> Back
      </button>
      <!-- Page heading: eyebrow label, page title, and short description -->
      <span class="eyebrow">Student Information</span>
      <h1>View All Students</h1>
      <p class="muted">
        Here you can view all registered students for this event
      </p>
      <!-- Table headers are fixed; the tbody below is empty on purpose -
     main.js fills it in from our registration data -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>FIRST NAME</th>
              <th>LAST NAME</th>
              <th>EMAIL</th>
              <th>ATTENDANCE</th>
            </tr>
          </thead>
          <tbody id="registeredStudentsTable">
            <!-- ^ main.js finds this id and injects one row per student, counting registrations from the REGISTRATIONS data -->
          </tbody>
        </table>
      </div>
    </main>

    <!-- ================= FOOTER (same on every page) ============ -->
    <footer class="footer">
      Smart Campus Event Planner · SOEN 287 Summer 2026 · Team 3
    </footer>
  </body>
</html>
