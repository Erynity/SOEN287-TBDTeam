<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport tag = required for responsive design on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Event Details - Smart Campus Event Planner</title>

    <!-- Shared font + stylesheet. Path is relative to /views/. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../public/css/style.css" />
    <link rel="icon" href="../public/images/favicon.svg" type="image/svg+xml" />
    <script src="../public/js/main.js" defer></script>
    <script src="../public/js/formValidation.js" defer></script>
  </head>

  <body>
    <nav class="navbar">
      <div class="navbar-inner">
        <a class="navbar-brand" href="index.html">
          <img
            src="../public/images/logo.svg"
            alt=""
            width="28"
            height="28"
            style="vertical-align: middle; margin-right: 6px"
          />
          Campus Events
        </a>

        <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>

        <ul class="navbar-links" id="navbar-links"></ul>
      </div>
    </nav>

    <!-- ================= CONTENT ====================== -->
    <main>
      <button class="btn btn-secondary back-btn" onclick="history.back()">
        <span style="font-size: 1.5em; line-height: 1">←</span> Back
      </button>

      <span class="eyebrow">Event Details</span>

      <div class="card">
        <div class="flex-between">
          <h1 id="eventTitle"></h1>
          <span id="eventStatus" class="badge badge-open"></span>
        </div>
        <div class="flex-between">
          <!-- category-->
          <p id="eventCategory" class="badge badge-open"></p>
          <!--organizer-->
          <p>organized by <span id="eventOrganizer"></span></p>
        </div>

        <!-- date, start and end time-->
        <p id="eventDateTime" class="muted"></p>

        <!--location-->
        <p id="eventLocation" class="muted"></p>

        <!-- event description-->
        <p id="eventDescription"></p>

        <div class="flex-between">
          <!--capacity-->
          <p id="eventCapacity" class="muted"></p>

          <!--guest controls-->
          <div id="guestControls" hidden>
            <p class="muted">Please log in to register for this event.</p>
          </div>

          <!-- student controls-->
          <div id="studentControls" hidden>
            <button id="registerBtn" class="btn">Register</button>
            <button id="cancelRegistrationBtn" class="btn btn-secondary">
              Cancel Registration
            </button>
          </div>

          <!-- admin controls-->
          <div id="adminControls" hidden>
            <a id="editEventBtn" class="btn" href="#">Edit Event</a>
            <a id="cancelEventBtn" class="btn" href="#">Cancel Event</a>
            <a
              id="viewRegistrationsBtn"
              class="btn"
              href="admin-registrations.html"
              >View Registrations</a
            >
          </div>
        </div>
      </div>
    </main>

    <!-- ================= FOOTER (same on every page) ============ -->
    <footer class="footer">
      Smart Campus Event Planner · SOEN 287 Summer 2026 · Team 13
    </footer>
  </body>
</html>
