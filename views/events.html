<!doctype html>
<html lang="en">
  <head>
     <!-- ==========================================================
                  Events
       ========================================================== -->
    <meta charset="UTF-8" />
    <!-- viewport tag = required for responsive design on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Events - Smart Campus Event Planner</title>

    <!-- Shared font + stylesheet. Path is relative to /views/. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../public/css/style.css" />
    <link rel="icon" href="../public/images/favicon.svg" type="image/svg+xml" />
    <script src="../public/js/main.js" defer></script>
    <script src="../public/js/formValidation.js" defer></script>
  </head>

  <body data-back="auto">
    <nav class="navbar">
      <div class="navbar-inner">
        <a class="navbar-brand" href="index.html">
          <img
            src="../public/images/logo.svg"
            alt=""
            width="28"
            height="28"
            style="vertical-align: middle; margin-right: 6px"
          />
          Campus Events
        </a>

        <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>

        <ul class="navbar-links" id="navbar-links"></ul>
      </div>
    </nav>

    <!-- ================= CONTENT ====================== -->
    <main>
       <!-- Back button: returns to the previous page (admin dashboard) -->
       <button class="btn btn-secondary back-btn" onclick="history.back()">
        <span style="font-size: 1.5em; line-height: 1">←</span> Back
      </button>
      <span class="eyebrow">Events</span>
      <h1>Every Event in one place</h1>

      <!--filters and search function
        filters for category, date, location and organizer-->
      <section class="filters">
        <label for="searchInput">Search Events</label>
        <input type="text" id="searchInput" placeholder="Search events..." />

        <div class="filter-row">
          <select id="categoryFilter">
            <option value="">All Categories</option>
            <option>Academic workshops</option>
            <option>Career events</option>
            <option>Club activities</option>
            <option>Sports events</option>
            <option>Cultural events</option>
            <option>Volunteering events</option>
            <option>Social events</option>
            <option>Guest lectures</option>
            <option>Networking events</option>
            <option>Other</option>
          </select>

          <select id="organizerFilter">
            <option value="">All Organizers</option>
          </select>

          <select id="statusFilter">
            <option value="">All Statuses</option>
            <option>Open</option>
            <option>Full</option>
            <option>Cancelled</option>
            <option>Completed</option>
          </select>
          <select id="sortFilter">
            <option value="">Sort By</option>
            <option value="title">A-Z</option>
            <option value="date">Date</option>
          </select>
        </div>
      </section>

      <!--events populated by js in main.js-->
      <div class="grid" id="EVENT_GRID"></div>
    </main>

    <!-- ================= FOOTER (same on every page) ============ -->
    <footer class="footer">
      Smart Campus Event Planner · SOEN 287 Summer 2026 · Team 13
    </footer>
  </body>
</html>
